when:
  - event: pull_request
    path: 'Dockerfile'
  - event: 'manual'

variables:
  - &repo ${CI_FORGE_URL##https://}/${CI_REPO_OWNER,,}/${CI_REPO_NAME##.}

steps:
  build:
    image: 'woodpeckerci/plugin-docker-buildx@sha256:9a22c00b4952e405d11e66d29772edbeb1f7b24f27f71cda251ecb838e725e86'
    settings:
      repo: *repo
      registry: ${CI_FORGE_URL}
      dry_run: true
