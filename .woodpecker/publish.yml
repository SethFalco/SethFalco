when:
  - event: 'push'
    branch: 'main'
    path:
      - 'Dockerfile'
      - '.dockerignore'
  - event: 'manual'

variables:
  - &repo ${CI_FORGE_URL##https://}/${CI_REPO_OWNER,,}/${CI_REPO_NAME##.}

steps:
  publish:
    image: 'woodpeckerci/plugin-docker-buildx:6.1.1@sha256:9a22c00b4952e405d11e66d29772edbeb1f7b24f27f71cda251ecb838e725e86'
    settings:
      repo: *repo
      registry: ${CI_FORGE_URL}
      tags: 'latest'
      username: ${CI_REPO_OWNER}
      password:
        from_secret: codeberg_registry_write
